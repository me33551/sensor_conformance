event:
  concept:instance: 116608
  id:id: ex-ante
  cpee:instance: a12ef327-1c78-46dd-8be8-c32b803680d1
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/change
  cpee:description: |
    <?xml version="1.0"?>
    <description xmlns="http://cpee.org/ns/description/1.0">
      <manipulate id="a20" label="init simulation">
        <code># all random numbers of the instance come from its seed, so that the instance can be regenerated
    data.seed = Random.new_seed % 2147483647
    r = Random.new(data.seed)
    # repeated measurement at the beginning (extra iteration of "record") in 30% of the instances
    data.extra = r.rand() &lt; 0.3
    warmup = { 'name' =&gt; 'warmup', 'behavior' =&gt; 'steady', 'level' =&gt; 5, 'noise' =&gt; 0.3, 'points' =&gt; 10 }
    ramp = { 'name' =&gt; 'ramp', 'behavior' =&gt; 'ramp', 'to' =&gt; 12, 'noise' =&gt; 0.3, 'points' =&gt; 10 }
    outcome = { 'name' =&gt; 'outcome', 'behavior' =&gt; 'steady', 'noise' =&gt; 0.3, 'points' =&gt; 10 }
    data.phases = ((data.extra ? [warmup, warmup] : [warmup]) + [ramp, outcome]).to_json
    # the decision replaces the outcome phase: a stays at the level of the ramp, b (desired) decreases, c increases
    data.outcomes = {
      'a' =&gt; [outcome],
      'b' =&gt; [outcome.merge('behavior' =&gt; 'ramp', 'to' =&gt; 3)],
      'c' =&gt; [outcome.merge('behavior' =&gt; 'ramp', 'to' =&gt; 18)]
    }.to_json
    data.at = data.extra ? 3 : 2</code>
      </manipulate>
      <parallel wait="-1" cancel="last">
        <parallel_branch>
          <call id="a1" endpoint="timeout">
            <parameters>
              <label>A</label>
              <arguments>
                <timeout>4</timeout>
              </arguments>
            </parameters>
          </call>
          <call id="a13" endpoint="timeout">
            <parameters>
              <label>B</label>
              <arguments>
                <timeout>6</timeout>
              </arguments>
            </parameters>
          </call>
          <call id="a8" endpoint="decide">
            <parameters>
              <label>random decision</label>
              <arguments>
                <options>{"a":2,"b":3,"c":1}</options>
                <outcomes>!data.outcomes</outcomes>
                <at>!data.at</at>
                <seed>!data.seed + 1</seed>
              </arguments>
            </parameters>
            <code>
              <finalize output="result">data.decision = result['decision']</finalize>
            </code>
          </call>
          <call id="a2" endpoint="timeout">
            <parameters>
              <label>C</label>
              <arguments>
                <timeout>30</timeout>
              </arguments>
            </parameters>
          </call>
          <call id="a3" endpoint="timeout">
            <parameters>
              <label>D</label>
              <arguments>
                <timeout>2</timeout>
              </arguments>
            </parameters>
          </call>
          <call id="a4" endpoint="timeout">
            <parameters>
              <label>E</label>
              <arguments>
                <timeout>2</timeout>
              </arguments>
            </parameters>
          </call>
          <call id="a5" endpoint="timeout">
            <parameters>
              <label>F</label>
              <arguments>
                <timeout>2</timeout>
              </arguments>
            </parameters>
          </call>
          <choose mode="exclusive">
            <alternative condition="data.decision == 'a'">
              <call id="a14" endpoint="timeout">
                <parameters>
                  <label>G</label>
                  <arguments>
                    <timeout>1</timeout>
                  </arguments>
                </parameters>
              </call>
            </alternative>
            <alternative condition="data.decision == 'b'">
              <call id="a7" endpoint="timeout">
                <parameters>
                  <label>H</label>
                  <arguments>
                    <timeout>1</timeout>
                  </arguments>
                </parameters>
              </call>
            </alternative>
            <otherwise>
              <call id="a11" endpoint="timeout">
                <parameters>
                  <label>I</label>
                  <arguments>
                    <timeout>1</timeout>
                  </arguments>
                </parameters>
              </call>
            </otherwise>
          </choose>
        </parallel_branch>
        <parallel_branch>
          <call id="a6" endpoint="record">
            <parameters>
              <label>record</label>
              <arguments>
                <stream>sensor</stream>
                <interval>1</interval>
                <start>5</start>
                <seed>!data.seed</seed>
                <phases>!data.phases</phases>
              </arguments>
            </parameters>
            <annotations>
              <_context_data_analysis>
                <probes>
                  <probe>
                    <id>sensor</id>
                    <source>simulation</source>
                    <extractor_type>extrinsic</extractor_type>
                    <extractor_code>if(result.is_a?(Hash) &amp;&amp; result['points'].is_a?(Array)) then
      s = Stream.new('sensor')
      result['points'].each do |p|
        sp = StreamPoint.new('sensor')
        sp.value = p['value']
        sp.timestamp = p['timestamp']
        s &lt;&lt; sp
      end
      s
    end</extractor_code>
                    <extractor_url/>
                    <extractor_params/>
                    <visualizer_url/>
                    <visualizer_params/>
                  </probe>
                </probes>
                <ips/>
              </_context_data_analysis>
            </annotations>
          </call>
        </parallel_branch>
      </parallel>
    </description>
  cpee:change_uuid: f1f7904d410f2d7c2d3105f54a28b5e99ba0af99
  time:timestamp: '2026-11-15T02:25:02.374629+01:00'
